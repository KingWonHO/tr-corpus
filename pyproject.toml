[project]
name = "tr-corpus"
version = "1.3.0"
description = "Thermal-runaway early-warning experiments on the harmonized TR corpus"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "pyarrow==25.0.1",
    "scikit-learn==1.8.0",
    "xgboost==3.2.0",
    "lightgbm==4.7.0",
    "torch==2.11.0",
    "mambapy==1.2.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# CUDA 12.8 builds of torch come from the PyTorch index
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
